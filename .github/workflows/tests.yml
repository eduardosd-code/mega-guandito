name: tests
on: [push, pull_request]
jobs:
  headless:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
      - name: Run smoke tests
        shell: pwsh
        run: ./tools/run_tests.ps1 -Godot "$PWD/godot/Godot_v4.7.2-stable_win64_console.exe"
